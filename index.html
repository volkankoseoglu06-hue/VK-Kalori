<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>VK Yaşam Koçu</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container">

<header>

<div>

<h1>VK Yaşam Koçu</h1>

<p id="todayDate"></p>

</div>

<button id="profileBtn">

👤

</button>

</header>

<!-- ANA SAYFA -->

<section id="homePage"
class="page active">

<div class="targets">

<div class="target-card">

<div class="circle">

<div id="calorieTarget">

0/0

</div>

</div>

<h3>🔥 Kalori</h3>

</div>

<div class="target-card">

<div class="circle">

<div id="proteinTarget">

0/0

</div>

</div>

<h3>🥩 Protein</h3>

</div>

<div class="target-card">

<div class="circle">

<div id="waterTarget">

0/0

</div>

</div>

<h3>💧 Su</h3>

</div>

<div class="target-card">

<div class="circle">

<div id="sportTarget">

0

</div>

</div>

<h3>🚶 Spor</h3>

</div>

</div>

<div class="summary">

<h2>📋 Bugünün Özeti</h2>

<div id="mealSummary">

<div>🔥 Kalori: <span id="summaryCalories">0</span></div>

<div>🥩 Protein: <span id="summaryProtein">0</span></div>

<div>💧 Su: <span id="summaryWater">0</span> L</div>

<div>🚶 Spor: <span id="summarySport">0</span> kcal</div>

</div>

</div>

<div class="quick-actions">

<button id="addWaterBtn">

💧 +250 ml Su

</button>

<button id="finishDayBtn">

📅 Günü Bitir

</button>

</div>

</section>

<!-- SPOR -->

<section id="sportPage"
class="page">

<div class="profile-box">

<div>

⏱️ Süre:

<span id="durationValue">

45

</span>

dk

</div>

<div>

⚡ Hız:

<span id="speedValue">

5

</span>

km/sa

</div>

<div>

⛰️ Eğim:

<span id="inclineValue">

5

</span>

%

</div>

</div>

<input
id="sportDuration"
type="range"
min="5"
max="180"
value="45">

<input
id="sportSpeed"
type="range"
min="3"
max="10"
value="5">

<input
id="sportIncline"
type="range"
min="0"
max="15"
value="5">

<div id="sportCalories">

Yakılan kalori: 0 kcal

</div>

</section>

<!-- GEÇMİŞ -->

<section id="historyPage"
class="page">

<div id="historyList">

Henüz kayıt yok.

</div>

</section>

<!-- PROFİL -->

<section id="profilePage"
class="page">

<input
id="userWeight"
type="number"
placeholder="Kilo">

<input
id="userHeight"
type="number"
placeholder="Boy">

<input
id="userAge"
type="number"
placeholder="Yaş">

<button id="saveProfileBtn">

💾 Kaydet

</button>

</section>

<nav>

<button class="nav-btn"
data-page="homePage">

🏠

<span>Ana Sayfa</span>

</button>

<button class="nav-btn"
data-page="sportPage">

💪

<span>Spor</span>

</button>

<button class="nav-btn"
data-page="historyPage">

📈

<span>Geçmiş</span>

</button>

<button class="nav-btn"
data-page="profilePage">

👤

<span>Profil</span>

</button>

</nav>

</div>

<script src="app.js"></script>

</body>

</html>
