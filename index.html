<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>VK Yaşam Koçu</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#111;
padding:20px;
padding-bottom:100px;
}

.container{
max-width:650px;
margin:auto;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

h1{
font-size:30px;
}

.subtitle{
color:#777;
margin-top:5px;
}

.settings{
width:55px;
height:55px;
border:none;
border-radius:50%;
background:#d71920;
color:#fff;
font-size:24px;
cursor:pointer;
}

.dashboard{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-bottom:20px;
}

.circleCard{
background:#fff;
padding:20px;
border-radius:25px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.circle{
width:120px;
height:120px;
margin:auto;
border:10px solid #d71920;
border-radius:50%;

display:flex;
justify-content:center;
align-items:center;

font-weight:700;
font-size:22px;
}

.circleCard p{
margin-top:12px;
font-size:18px;
}

.mode{
display:flex;
gap:10px;
margin-bottom:20px;
}

.mode button{
flex:1;
}

.active{
background:#d71920 !important;
}

.card{
background:#fff;
padding:22px;
border-radius:25px;
margin-bottom:20px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card h2{
margin-bottom:15px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:#111;
color:#fff;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

.summary{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.summary div{
background:#fafafa;
padding:15px;
border-radius:12px;
}

@media(max-width:500px){

.dashboard{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="container">

<header>

<div>

<h1>VK Yaşam Koçu</h1>

<p class="subtitle"
id="todayDate">

</p>

</div>

<button class="settings">

⚙️

</button>

</header>

<section class="dashboard">

<div class="circleCard">

<div class="circle">

<span id="kcal">

0/2200

</span>

</div>

<p>

🔥 Kalori

</p>

</div>

<div class="circleCard">

<div class="circle">

<span id="protein">

0/165

</span>

</div>

<p>

🥩 Protein

</p>

</div>

<div class="circleCard">

<div class="circle">

<span id="water">

0/3

</span>

</div>

<p>

💧 Su

</p>

</div>

<div class="circleCard">

<div class="circle">

<span id="carb">

0/220

</span>

</div>

<p>

🍞 Karbonhidrat

</p>

</div>

</section>

<section class="mode">

<button
class="active"
id="sportButton">

🏋️ Spor Günü

</button>

<button
id="restButton">

🌙 Normal Gün

</button>

</section>

<section class="card">

<h2>

📋 Bugünün Özeti

</h2>

<div class="summary">

<div>

🍳 Kahvaltı

<br>

<span id="breakfast">

0

</span>

</div>

<div>

🍲 Öğle

<br>

<span id="lunch">

0

</span>

</div>

<div>

🍽️ Akşam

<br>

<span id="dinner">

0

</span>

</div>

<div>

☕ Ara Öğün

<br>

<span id="snack">

0

</span>

</div>

</div>

<button
id="waterButton">

💧 +250 ml Su

</button>

</section>
