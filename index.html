<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VK Takip</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
padding:10px;
font-family:-apple-system,Arial,sans-serif;
background:#f3f4f6;
color:#111;
max-width:430px;
margin:auto
}
.card{
background:#fff;
padding:12px;
margin-bottom:10px;
border-radius:18px;
box-shadow:0 3px 12px rgba(0,0,0,.08)
}
.top{
background:linear-gradient(90deg,#111,#d71920);
color:#fff
}
.title{
font-size:22px;
font-weight:900
}
.small{
font-size:12px;
color:#666
}
.top .small{color:#ddd}
.summary{
font-size:30px;
font-weight:900
}
.progress{
height:8px;
background:#eee;
border-radius:20px;
overflow:hidden;
margin-top:8px
}
.fill{
height:100%;
background:#d71920;
width:0
}
.circles{
display:flex;
justify-content:space-between;
margin-top:12px
}
.circle{
width:70px;
height:70px;
border:4px solid #eee;
border-radius:50%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-size:10px
}
.circle b{
font-size:18px
}
input,select,button{
width:100%;
padding:10px;
margin-top:6px;
border-radius:12px;
border:1px solid #ddd
}
button{
border:0;
font-weight:700
}
.red{
background:#d71920;
color:#fff
}
.black{
background:#111;
color:#fff
}
.gray{
background:#eee
}
.item{
background:#f8f8f8;
padding:10px;
border-radius:12px;
margin-top:6px;
display:flex;
justify-content:space-between;
align-items:center
}
.del{
width:34px;
height:34px;
padding:0;
margin:0;
background:#ffe5e5;
color:#c00
}
</style>
</head>

<body>

<div class="card top">
<div class="title">VK Takip</div>
<div class="small">Kalori • Protein • Spor</div>
</div>

<div class="card">
<div class="summary">
<span id="total">0</span>/<span id="targetText">1700</span>
</div>

<div class="progress">
<div class="fill" id="fill"></div>
</div>

<div class="circles">

<div class="circle">
<b id="protein">0</b>
Protein
</div>

<div class="circle">
<b id="sport">0</b>
Spor
</div>

<div class="circle">
<b id="count">0</b>
Besin
</div>

</div>
</div>

<div class="card">

<b>⚙️ Ayarlar</b>

<input id="height" placeholder="Boy (cm)" value="175">

<input id="weight" placeholder="Kilo (kg)" value="109">

<select id="mode" onchange="changeMode()">
<option value="1700">🛋️ Normal Gün</option>
<option value="1900">🏋️ Spor Günü</option>
</select>

</div>

<div class="card">

<b>🍽️ Yemek</b>

<input id="food" placeholder="Tavuk, yumurta, pilav...">

<input id="qty" type="number" placeholder="Gram / adet">

<button class="black" onclick="calculateFood()">
Hesapla
</button>

<div id="calc"></div>

<button id="addBtn" class="red" style="display:none" onclick="addFood()">
Yemeği Ekle
</button>

</div>

<div class="card">

<b>🏃 Egzersiz</b>

<select id="exercise">
<option>Yürüyüş</option>
<option>Koşu</option>
<option>Bisiklet</option>
<option>Ağırlık</option>
</select>

<input id="minute" type="number" placeholder="Dakika">

<button class="black" onclick="addExercise()">
Egzersizi Ekle
</button>

</div>

<div class="card">

<b>📋 Bugün</b>

<div id="foods"></div>

</div>

<div class="card">

<b>📅 Geçmiş</b>

<div id="history"></div>

<button class="gray" onclick="finishDay()">
Günü Bitir
</button>

</div>

<script>

const db={
"yumurta":[78,6.3,1],
"füme peynir":[225,16,100],
"beyaz peynir":[264,14,100],
"lor":[98,11,100],
"ekmek":[265,9,100],
"tam buğday ekmek":[247,13,100],
"tavuk":[165,31,100],
"pilav":[130,2.7,100],
"bulgur":[120,3.1,100],
"kuru fasulye":[127,8.7,100],
"nohut":[164,8.9,100],
"yoğurt":[61,3.5,100],
"köfte":[250,20,100],
"protein tozu":[100,20,25]
};

const exerciseDb={
"Yürüyüş":5,
"Koşu":12,
"Bisiklet":9,
"Ağırlık":7
};

let data=JSON.parse(localStorage.getItem("vk")||
'{"foods":[],"sport":0,"history":[]}');

let temp=null;

function save(){
localStorage.setItem("vk",JSON.stringify(data));
}

function findFood(n){
n=n.toLowerCase();
return Object.keys(db).find(x=>n.includes(x));
}

function changeMode(){
targetText.innerText=mode.value;
render();
}

function calculateFood(){

let key=findFood(food.value);

if(!key){
calc.innerHTML="Besin bulunamadı.";
return;
}

let q=Number(qty.value);

let f=q/db[key][2];

temp={
name:key,
qty:q,
kcal:Math.round(db[key][0]*f),
protein:Math.round(db[key][1]*f)
};

calc.innerHTML=
"<div class='item'>"+
temp.kcal+
" kcal • "+
temp.protein+
" g protein</div>";

addBtn.style.display="block";
}

function addFood(){

data.foods.push(temp);

food.value="";
qty.value="";
calc.innerHTML="";
addBtn.style.display="none";

save();

render();
}

function addExercise(){

let ex=exercise.value;

let m=Number(minute.value);

data.sport+=exerciseDb[ex]*m;

save();

render();
}

function del(i){

data.foods.splice(i,1);

save();

render();
}

function finishDay(){

data.history.unshift(
new Date().toLocaleDateString("tr-TR")+
" • "+
getTotal()+
" kcal"
);

data.foods=[];

data.sport=0;

save();

render();
}

function getTotal(){

let t=0;

data.foods.forEach(x=>t+=x.kcal);

t-=data.sport;

return Math.max(0,t);
}

function render(){

let p=0;

foods.innerHTML=data.foods.map((x,i)=>{

p+=x.protein;

return "<div class='item'><div><b>"+x.name+
"</b><div class='small'>"+
x.kcal+
" kcal • "+
x.protein+
" g</div></div><button class='del' onclick='del("+i+")'>✕</button></div>";

}).join("")||"Kayıt yok.";

history.innerHTML=data.history.join("<br>");

total.innerText=getTotal();

protein.innerText=p;

sport.innerText=data.sport;

count.innerText=data.foods.length;

fill.style.width=
Math.min(100,getTotal()/mode.value*100)+"%";
}

render();

</script>

</body>
</html>
