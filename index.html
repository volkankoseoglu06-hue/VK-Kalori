<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VK Yaşam Koçu</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>VK Yaşam Koçu</h1></header>
<nav class="bottomNav">
<button data-page="home">🏠<br>Ana Sayfa</button>
<button data-page="food">🍽️<br>Besinler</button>
<button data-page="sport">💪<br>Spor</button>
<button data-page="history">📈<br>Geçmiş</button>
<button data-page="profile">👤<br>Profil</button>
</nav>
<section id="home" class="page active"><div class="card"><h2>Günlük Özet</h2><div id="summary"></div><button id="addWater">💧 +250 ml</button><button id="finishDay">📅 Günü Bitir</button></div></section>
<section id="food" class="page"><div class="card"><input id="foodSearch" placeholder="Besin ara"><div id="foodResults"></div><button id="addCustom">➕ Yeni besin ekle</button></div></section>
<section id="sport" class="page"><div class="card"><label>Dakika <input type="range" id="duration" min="5" max="180" value="45"></label><div id="sportOut"></div></div></section>
<section id="history" class="page"><div class="card"><div id="historyList"></div></div></section>
<section id="profile" class="page"><div class="card"><input id="weight" placeholder="Kilo"><input id="height" placeholder="Boy"><input id="age" placeholder="Yaş"></div></section>
<script src="foods.js"></script><script src="app.js"></script></body></html>
