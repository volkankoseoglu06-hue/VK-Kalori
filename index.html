<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>VK Kalori</title>

<link rel="manifest"
href="manifest.json">

<link rel="stylesheet"
href="style.css">

</head>

<body>

<header>

<div class="header-title">

VK KALORİ

</div>

<div>

👤

</div>

</header>

<div class="container">

<div class="page active"
id="home">

<div class="card summary-card">

<div class="summary-title">

🔥 Bugünkü Özet

</div>

<div class="stat">

<span>Kalori</span>

<span>

<b id="totalCalories">

0

</b>

/

1900

</span>

</div>

<div class="stat">

<span>Protein</span>

<span>

<b id="totalProtein">

0

</b>

/

150 g

</span>

</div>

<div class="stat">

<span>Karbonhidrat</span>

<span>

<b id="totalCarb">

0

</b>

/

180 g

</span>

</div>

<div class="stat">

<span>Yağ</span>

<span>

<b id="totalFat">

0

</b>

/

65 g

</span>

</div>

</div>

<div class="card">

<h2>

⚡ Hızlı İşlemler

</h2>

<div class="quick-grid">

<div class="quick-item"
onclick="openPage('photo')">

📷

<br>

Fotoğraf

</div>

<div class="quick-item"
onclick="openPage('ai')">

🤖

<br>

Yapay Zeka

</div>

<div class="quick-item"
onclick="openPage('foods')">

🍽️

<br>

Besin Ara

</div>

<div class="quick-item">

➕

<br>

Öğün Ekle

</div>

</div>

</div>

</div>

<div class="page"
id="foods">

<div class="card">

<h2>

🍽️ Besin Ara

</h2>

<input
id="foodSearch"
placeholder="Besin ara..."
onkeyup="searchFoods()">

<div
id="foodResults">

</div>

</div>

</div>

<div class="page"
id="photo">

<div class="card">

<h2>

📷 Fotoğraf Analizi

</h2>

<div class="photo-box">

<input
type="file"
accept="image/*"
capture="environment">

<button>

Analiz Et

</button>

</div>

</div>

<div class="card">

<h2>

🍽️ Analiz Sonucu

</h2>

<div id="analysisResults">

Henüz analiz yapılmadı.

</div>

<select>

<option>

Öğün seç

</option>

<option>

Kahvaltı

</option>

<option>

Öğle Yemeği

</option>

<option>

Akşam Yemeği

</option>

<option>

Ara Öğün

</option>

</select>

<button>

➕ Öğüne Ekle

</button>

</div>

</div>

<div class="page"
id="ai">

<div class="card">

<h2>

🤖 VK AI

</h2>

<input
id="aiQuestion"
placeholder="Sorunu yaz">

<button
onclick="askAI()">

Sor

</button>

<div
class="ai-response"
id="aiAnswer">

Merhaba Volkan.

</div>

</div>

</div>

</div>

<div class="bottom-nav">

<div
class="nav-item"
onclick="openPage('home')">

🏠

<br>

Ana

</div>

<div
class="nav-item"
onclick="openPage('foods')">

🍽️

<br>

Besin

</div>

<div
class="nav-item"
onclick="openPage('photo')">

📷

<br>

Analiz

</div>

<div
class="nav-item"
onclick="openPage('ai')">

🤖

<br>

AI

</div>

</div>

<script
src="foods.js">

</script>

<script
src="app.js">

</script>

<script
src="ai.js">

</script>

<script
src="camera.js">

</script>

</body>

</html>
