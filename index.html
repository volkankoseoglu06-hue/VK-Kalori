<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>VK Yaşam Koçu 5.0</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

<header class="header">

<h1>VK Yaşam Koçu</h1>

<p id="today"></p>

</header>

<section id="homePage" class="page active">

<div class="dashboard">

<div class="card stat">

<h2 id="currentCalories">0</h2>

<p>🔥 Kalori</p>

<small>Hedef:
<span id="targetCalories">2500</span>
</small>

</div>

<div class="card stat">

<h2 id="currentProtein">0</h2>

<p>🥩 Protein</p>

<small>Hedef:
<span id="targetProtein">165</span>
</small>

</div>

<div class="card stat">

<h2 id="currentWater">0</h2>

<p>💧 Su (L)</p>

<small>Hedef:
<span id="targetWater">3</span>
</small>

</div>

<div class="card stat">

<h2 id="currentSport">0</h2>

<p>💪 Spor</p>

</div>

</div>

<div class="card">

<h3>Bugünkü Besinler</h3>

<div id="dailyFoods"></div>

<h3>Bugünkü Sporlar</h3>

<div id="dailySports"></div>

</div>

<button id="waterButton">

💧 +250 ml Su

</button>

<button id="finishDayButton">

📅 Günü Bitir

</button>

</section>

<section id="foodPage" class="page">

<div class="card">

<input
id="foodSearch"
placeholder="Besin ara">

<div id="foodResults"></div>

</div>

<div class="card">

<h3>Yeni Besin</h3>

<input
id="newFoodName"
placeholder="Besin adı">

<input
id="newFoodCalories"
type="number"
placeholder="Kalori">

<input
id="newFoodProtein"
type="number"
placeholder="Protein">

<select id="newFoodUnit">

<option>100 g</option>

<option>adet</option>

<option>dilim</option>

<option>porsiyon</option>

<option>ölçek</option>

</select>

<button id="saveFoodButton">

Kaydet

</button>

</div>

</section>

<section id="sportPage" class="page">

<div class="card">

<label>

Süre:

<span id="durationLabel">

45

</span>

dk

</label>

<input
id="sportDuration"
type="range"
min="5"
max="180"
value="45">

<label>

Hız:

<span id="speedLabel">

5

</span>

km/sa

</label>

<input
id="sportSpeed"
type="range"
min="3"
max="10"
value="5">

<label>

Eğim:

<span id="inclineLabel">

5

</span>

%

</label>

<input
id="sportIncline"
type="range"
min="0"
max="15"
value="5">

<h3 id="sportResult">

Yakılan kalori: 0

</h3>

<button id="calculateSportButton">

Hesapla

</button>

<button id="addSportButton">

Günlüğe Ekle

</button>

</div>

</section>

<section id="historyPage" class="page">

<div class="card">

<h3>Geçmiş</h3>

<div id="historyList"></div>

</div>

</section>

<section id="profilePage" class="page">

<div class="card">

<input
id="profileCalories"
type="number"
placeholder="Hedef kalori">

<input
id="profileProtein"
type="number"
placeholder="Hedef protein">

<input
id="profileWater"
type="number"
placeholder="Hedef su">

<button
id="saveProfileButton">

Kaydet

</button>

</div>

</section>

<nav class="bottom-nav">

<button data-page="homePage">

🏠

</button>

<button data-page="foodPage">

🍽️

</button>

<button data-page="sportPage">

💪

</button>

<button data-page="historyPage">

📈

</button>

<button data-page="profilePage">

👤

</button>

</nav>

</div>

<script src="foods.js"></script>

<script src="app.js"></script>

</body>
</html>
