<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VK Takip</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;
background:#f3f4f6;
color:#111;
}

.app{
max-width:390px;
margin:auto;
padding:12px;
}

.header{
background:linear-gradient(90deg,#111,#d71920);
color:#fff;
padding:14px 18px;
border-radius:22px;
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
}

.logo{
font-size:26px;
font-weight:900;
}

.subtitle{
font-size:12px;
opacity:.9;
}

.card{
background:#fff;
padding:16px;
border-radius:22px;
margin-bottom:12px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.summary{
font-size:34px;
font-weight:900;
}

.progress{
height:10px;
background:#eee;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.fill{
height:100%;
width:0;
background:#d71920;
}

.rings{
display:flex;
justify-content:space-between;
margin-top:14px;
}

.ring{
width:82px;
height:82px;
border-radius:50%;
border:5px solid #eee;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-size:11px;
font-weight:700;
}

.ring b{
font-size:22px;
}

input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:14px;
margin-top:8px;
font-size:15px;
}

button{
border:0;
width:100%;
padding:13px;
border-radius:14px;
font-size:15px;
font-weight:700;
margin-top:8px;
}

.red{
background:#d71920;
color:#fff;
}

.black{
background:#111;
color:#fff;
}

.gray{
background:#ececec;
}

.food{
background:#f8f8f8;
padding:12px;
border-radius:16px;
margin-top:8px;
display:flex;
justify-content:space-between;
align-items:center;
}

.small{
font-size:12px;
color:#666;
}

.delete{
width:36px;
height:36px;
margin:0;
padding:0;
background:#ffe6e6;
color:#d71920;
}

.history{
padding:10px;
border-bottom:1px solid #eee;
font-size:14px;
}
</style>
</head>

<body>

<div class="app">

<div class="header">

<div>
<div class="logo">VK Takip</div>
<div class="subtitle">Kalori • Protein • Spor</div>
</div>

<div>🔥🥩🏃</div>

</div>

<div class="card">

<div>Günlük Özet</div>

<div class="summary">
<span id="kcal">0</span>/2100
</div>

<div class="progress">
<div class="fill" id="fill"></div>
</div>

<div class="rings">

<div class="ring">
<b id="protein">0</b>
Protein
</div>

<div class="ring">
<b id="exercise">0</b>
Spor
</div>

<div class="ring">
<b id="foodCount">0</b>
Besin
</div>

</div>

</div>

<div class="card">

<h3>🍽️ Yemek Hesapla</h3>

<input id="foodName" placeholder="Örn: tavuk, füme peynir">

<input id="foodQty" type="number" placeholder="Gram / adet">

<button class="red" onclick="addFood()">
Yemeği Hesapla ve Ekle
</button>

</div>

<div class="card">

<h3>🔥 Spor</h3>

<input id="exerciseInput" type="number" placeholder="Yakılan kalori">

<button class="black" onclick="addExercise()">
Kalori Düş
</button>

</div>

<div class="card">

<h3>📋 Bugünkü Yemekler</h3>

<div id="foods"></div>

</div>

<div class="card">

<h3>📅 Geçmiş</h3>

<div id="history"></div>

<button class="gray" onclick="finishDay()">
Günü Tamamla
</button>

</div>

</div>

<script>

const db={

"yumurta":[78,6.3,1],

"füme peynir":[225,16,100],

"beyaz peynir":[264,14,100],

"lor":[98,11,100],

"ekmek":[265,9,100],

"tam buğday ekmek":[247,13,100],

"tavuk":[165,31,100],

"köfte":[250,20,100],

"pilav":[130,2.7,100],

"bulgur":[120,3.1,100],

"kuru fasulye":[127,8.7,100],

"nohut":[164,8.9,100],

"yoğurt":[61,3.5,100],

"süt":[61,3.2,100],

"muz":[89,1.1,100],

"ton balığı":[116,26,100],

"protein bar":[200,20,1],

"protein tozu":[100,20,25],

"whey protein":[100,20,25]

};

let data=JSON.parse(
localStorage.getItem("vkapp")||
'{"foods":[],"exercise":0,"history":[]}'
);

function searchFood(name){

name=name.toLowerCase();

return Object.keys(db)
.find(x=>name.includes(x));

}

function addFood(){

const name=
document.getElementById("foodName").value;

const qty=
Number(
document.getElementById("foodQty").value
);

const key=
searchFood(name);

if(!key){

alert("Besin bulunamadı.");

return;

}

const factor=
qty/db[key][2];

data.foods.push({

name:key,

qty:qty,

kcal:Math.round(db[key][0]*factor),

protein:Math.round(db[key][1]*factor)

});

save();

document.getElementById("foodName").value="";

document.getElementById("foodQty").value="";

render();

}

function addExercise(){

data.exercise+=
Number(
document.getElementById("exerciseInput").value
)||0;

document.getElementById("exerciseInput").value="";

save();

render();

}

function deleteFood(i){

data.foods.splice(i,1);

save();

render();

}

function finishDay(){

const today=
new Date()
.toLocaleDateString("tr-TR");

const total=
calculateCalories();

data.history.unshift(

today+
" • "+
total+
" kcal"

);

if(data.history.length>10){

data.history.pop();

}

data.foods=[];

data.exercise=0;

save();

render();

}

function calculateCalories(){

let total=0;

data.foods.forEach(
x=>total+=x.kcal
);

total-=data.exercise;

return total<0?0:total;

}

function save(){

localStorage.setItem(
"vkapp",
JSON.stringify(data)
);

}

function render(){

let protein=0;

let html="";

data.foods.forEach((x,i)=>{

protein+=x.protein;

html+=`

<div class="food">

<div>

<b>${x.name}</b>

<div class="small">

${x.qty} •
${x.kcal} kcal •
${x.protein} g protein

</div>

</div>

<button
class="delete"
onclick="deleteFood(${i})"
>

✕

</button>

</div>

`;

});

document.getElementById("foods").innerHTML=
html||"Henüz kayıt yok.";

document.getElementById("history").innerHTML=

data.history
.map(
x=>`<div class="history">${x}</div>`
)
.join("")
||

"Henüz geçmiş yok.";

const total=
calculateCalories();

document.getElementById("kcal").innerText=
total;

document.getElementById("protein").innerText=
protein;

document.getElementById("exercise").innerText=
data.exercise;

document.getElementById("foodCount").innerText=
data.foods.length;

document.getElementById("fill").style.width=

Math.min(
100,
total/2100*100
)+"%";

}

render();

</script>

</body>
</html>
