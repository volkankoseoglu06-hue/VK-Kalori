<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>VK Yaşam Koçu</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<header>

<div>
<h1>VK Yaşam Koçu</h1>
<p>Bugün</p>
</div>

<button class="settings-btn" onclick="toggleSettings()">
⚙️
</button>

</header>

<section class="dashboard">

<div class="circle-card">

<div class="progress-ring">
<span id="kcalValue">1450</span>
</div>

<p>🔥 Kalori</p>

</div>

<div class="circle-card">

<div class="progress-ring">
<span id="proteinValue">112</span>
</div>

<p>🥩 Protein</p>

</div>

<div class="circle-card">

<div class="progress-ring">
<span id="waterValue">2.1</span>
</div>

<p>💧 Su</p>

</div>

<div class="circle-card">

<div class="progress-ring">
<span id="carbValue">120</span>
</div>

<p>🍞 Karbonhidrat</p>

</div>

</section>

<section class="mode">

<button class="active">
🏋️ Spor Günü
</button>

<button>
🌙 Dinlenme
</button>

</section>

<section class="screen" id="homeScreen">

<div class="card">

<h2>📋 Bugünün Özeti</h2>

<ul>

<li>🍽️ Öğün: 4</li>

<li>👣 Adım: 8.200</li>

<li>🔥 Yakılan: 620 kcal</li>

</ul>

</div>

</section>

<section class="screen hidden" id="foodScreen">

<div class="card">

<h2>🍽️ Yemekler</h2>

<input
id="foodSearch"
placeholder="Peynir, zeytin, tavuk..."
onkeyup="searchFood()"
>

<div id="foodResults"></div>

<select>

<option>Gram</option>

<option>Adet</option>

<option>Porsiyon</option>

<option>ml</option>

<option>Ölçek</option>

</select>

<input type="number" value="100">

<button onclick="addFood()">

➕ Günlüğe Ekle

</button>

</div>

</section>

<section class="screen hidden" id="sportScreen">

<div class="card">

<h2>💪 Spor</h2>

<label>Süre</label>

<input
type="range"
min="5"
max="180"
value="45"
>

<label>Hız</label>

<input
type="range"
min="1"
max="10"
value="5"
>

<label>Eğim</label>

<input
type="range"
min="0"
max="15"
value="8"
>

<button>

🏃 Sporu Ekle

</button>

</div>

</section>

<section class="screen hidden" id="historyScreen">

<div class="card">

<h2>📈 Geçmiş</h2>

<p>Son 7 gün</p>

</div>

</section>

<section
class="settings-panel hidden"
id="settingsPanel"
>

<div class="card">

<h2>⚙️ Profil</h2>

<select>

<option>Erkek</option>

<option>Kadın</option>

</select>

<input placeholder="Yaş">

<input placeholder="Boy">

<input placeholder="Kilo">

<input placeholder="Hedef kilo">

<input placeholder="Kalori hedefi">

<input placeholder="Protein hedefi">

<input placeholder="Su hedefi">

</div>

</section>

<nav>

<button onclick="showScreen('homeScreen')">
🏠
</button>

<button onclick="showScreen('foodScreen')">
🍽️
</button>

<button onclick="showScreen('sportScreen')">
💪
</button>

<button onclick="showScreen('historyScreen')">
📈
</button>

</nav>

</div>

<script src="foods.js"></script>

<script src="app.js"></script>

</body>
</html>
