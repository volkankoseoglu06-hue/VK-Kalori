<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>VK Kalori</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f3f3;
color:#111;
}

header{
position:sticky;
top:0;
padding:15px;
background:#d71920;
color:#fff;
border-radius:0 0 20px 20px;
z-index:10;
}

.logo{
font-size:32px;
font-weight:900;
}

nav{
display:flex;
gap:8px;
overflow:auto;
margin-top:10px;
}

nav button{
border:0;
padding:10px 14px;
border-radius:12px;
font-weight:700;
background:#fff;
}

main{
max-width:800px;
margin:auto;
padding:12px;
}

.card{
background:#fff;
padding:16px;
border-radius:18px;
margin-bottom:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.hidden{
display:none;
}

input,select{
width:100%;
padding:10px;
border:1px solid #ddd;
border-radius:10px;
margin-top:6px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.btn{
border:0;
padding:12px;
border-radius:12px;
font-weight:700;
}

.red{
background:#d71920;
color:#fff;
}

.gray{
background:#ececec;
}

.bar{
height:12px;
background:#ddd;
border-radius:20px;
overflow:hidden;
}

.fill{
height:100%;
width:0;
background:#d71920;
}

.row{
display:grid;
grid-template-columns:90px 1fr 80px;
gap:6px;
margin-top:8px;
}

.big{
font-size:34px;
font-weight:900;
}

.macro{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:12px;
}

.macro div{
padding:12px;
background:#eee;
text-align:center;
border-radius:12px;
}

.history{
padding:12px;
border:1px solid #eee;
border-radius:12px;
margin-top:8px;
}

.mode{
display:flex;
gap:8px;
margin-top:12px;
}

.mode button{
flex:1;
padding:12px;
border:0;
border-radius:12px;
font-weight:700;
}

.active{
background:#d71920;
color:#fff;
}
</style>
</head>

<body>

<header>

<div class="logo">VK</div>

<div>Kalori • Beslenme • Spor</div>

<nav>
<button onclick="page('home')">Ana</button>
<button onclick="page('profile')">Profil</button>
<button onclick="page('food')">Beslenme</button>
<button onclick="page('history')">Geçmiş</button>
</nav>

</header>

<main>

<section id="home">

<div class="card">

<div>Günlük Hedef</div>

<div>
<span class="big" id="todayKcal">0</span>
/
<span id="goal"></span> kcal
</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="mode">

<button id="rest" onclick="setSport(false)">
🛋️ Dinlenme
</button>

<button id="sport" onclick="setSport(true)">
🏋️ Spor
</button>

</div>

<div class="macro">

<div>
🥩<br>
<b id="p">0</b> g
</div>

<div>
🍞<br>
<b id="c">0</b> g
</div>

<div>
🥑<br>
<b id="f">0</b> g
</div>

</div>

</div>

</section>

<section id="profile" class="hidden">

<div class="card">

<h2>Profil</h2>

Yaş
<input id="age">

Boy
<input id="height">

Kilo
<input id="weight">

Hedef Kilo
<input id="targetWeight">

<button class="btn red" onclick="saveProfile()">
Kaydet
</button>

<div id="bmrInfo"></div>

</div>

</section>

<section id="food" class="hidden">

<div class="card">

<h2>Beslenme</h2>

<select id="foodSelect"></select>

<input id="foodGram" placeholder="Gram">

<button class="btn red" onclick="addFood()">
Besin Ekle
</button>

<div id="mealList"></div>

</div>

</section>

<section id="history" class="hidden">

<div class="card">

<h2>Geçmiş</h2>

<button class="btn gray" onclick="finishDay()">
Günü Bitir
</button>

<div id="historyList"></div>

</div>

</section>

</main>

<script>

const foods={

"yumurta":[78,6,1,5],
"tavuk":[165,31,0,4],
"tavuk göğsü":[165,31,0,4],
"köfte":[250,20,5,18],
"somon":[208,20,0,13],
"ton balığı":[116,26,0,1],
"yumurta beyazı":[52,11,1,0],

"yoğurt":[61,3.5,5,3],
"süzme yoğurt":[97,9,4,5],
"ayran":[35,2,3,1],
"süt":[61,3,5,3],

"pirinç":[130,3,28,0],
"pilav":[130,3,28,0],
"bulgur":[120,3,26,0],
"makarna":[157,6,31,1],
"patates":[77,2,17,0],

"ekmek":[265,9,49,3],
"tam buğday ekmek":[247,13,41,4],
"lavaş":[290,8,56,3],

"muz":[89,1,23,0],
"elma":[52,0,14,0],
"armut":[57,0,15,0],
"portakal":[47,1,12,0],
"karpuz":[30,1,8,0],
"kavun":[34,1,8,0],
"çilek":[32,1,8,0],
"üzüm":[69,1,18,0],

"salatalık":[15,1,4,0],
"domates":[18,1,4,0],
"brokoli":[34,3,7,0],
"havuç":[41,1,10,0],
"ıspanak":[23,3,4,0],
"kabak":[17,1,3,0],

"ceviz":[654,15,14,65],
"badem":[579,21,22,50],
"fındık":[628,15,17,61],
"fıstık ezmesi":[588,25,20,50],

"sucuk":[450,20,2,40],
"döner":[215,22,5,12],
"lahmacun":[263,12,32,9],
"pide":[280,11,37,9],
"pizza":[266,11,33,10],
"hamburger":[295,17,30,12],

"kuru fasulye":[127,9,22,1],
"mercimek":[116,9,20,0],
"nohut":[164,9,27,3],
"tarhana çorbası":[150,5,22,4],
"mercimek çorbası":[180,9,25,5],

"çikolata":[535,7,59,30],
"dondurma":[207,4,24,11],
"bal":[304,0,82,0],
"reçel":[278,0,69,0]
};

let data=JSON.parse(localStorage.getItem("vk"))||{

profile:{
age:32,
height:175,
weight:109,
targetWeight:85
},

sport:false,
meals:[],
history:[]

};

function save(){

localStorage.setItem(
"vk",
JSON.stringify(data)
);

}

function page(id){

document
.querySelectorAll("main section")
.forEach(x=>x.classList.add("hidden"));

document
.getElementById(id)
.classList.remove("hidden");

}

function bmr(){

const p=data.profile;

return Math.round(
10*p.weight+
6.25*p.height-
5*p.age+
5
);

}

function goal(){

return data.sport
?bmr()+500
:bmr()+300;

}

function saveProfile(){

data.profile.age=
+age.value;

data.profile.height=
+height.value;

data.profile.weight=
+weight.value;

data.profile.targetWeight=
+targetWeight.value;

save();

refresh();

}

function setSport(v){

data.sport=v;

save();

refresh();

}

function addFood(){

const name=
foodSelect.value;

const gram=
+foodGram.value;

if(!gram)return;

const f=foods[name];

const factor=gram/100;

data.meals.push({

name,

gram,

kcal:f[0]*factor,

protein:f[1]*factor,

carb:f[2]*factor,

fat:f[3]*factor

});

save();

refresh();

}

function totals(){

return data.meals.reduce(

(a,b)=>{

a.kcal+=b.kcal;
a.p+=b.protein;
a.c+=b.carb;
a.f+=b.fat;

return a;

},

{
kcal:0,
p:0,
c:0,
f:0
}

);

}

function finishDay(){

const t=totals();

data.history.unshift({

date:new Date().toLocaleDateString("tr-TR"),

kcal:Math.round(t.kcal),

protein:Math.round(t.p)

});

data.meals=[];

save();

refresh();

}

function refresh(){

const t=totals();

todayKcal.textContent=
Math.round(t.kcal);

goal.innerText=
goal();

fill.style.width=
Math.min(
100,
t.kcal/goal()*100
)+"%";

p.textContent=
Math.round(t.p);

c.textContent=
Math.round(t.c);

f.textContent=
Math.round(t.f);

rest.classList.toggle(
"active",
!data.sport
);

sport.classList.toggle(
"active",
data.sport
);

age.value=data.profile.age;

height.value=data.profile.height;

weight.value=data.profile.weight;

targetWeight.value=
data.profile.targetWeight;

bmrInfo.innerHTML=

"<br>Bazal metabolizma: <b>"+

bmr()+

"</b> kcal";

mealList.innerHTML=

data.meals.map(x=>

"<div class='history'>"+

x.name+

" - "+

x.gram+

" g - "+

Math.round(x.kcal)+

" kcal</div>"

).join("");

historyList.innerHTML=

data.history.map(x=>

"<div class='history'>"+

x.date+

"<br>"+

x.kcal+

" kcal<br>"+

x.protein+

" g protein</div>"

).join("");

}

Object.keys(foods)
.sort()
.forEach(x=>{

foodSelect.innerHTML+=

"<option>"+

x+

"</option>";

});

refresh();

</script>

</body>
</html>
