<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>VK Yaşam Koçu</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container">

<header>

<div>

<h1>VK Yaşam Koçu</h1>

<p id="today"></p>

</div>

</header>

<!-- ANA SAYFA -->

<section id="homePage"
class="page">

<section class="dashboard">

<div class="statCard">

<div class="circle">

<span id="calorieValue">

0/2200

</span>

</div>

<p>🔥 Kalori</p>

</div>

<div class="statCard">

<div class="circle">

<span id="proteinValue">

0/165

</span>

</div>

<p>🥩 Protein</p>

</div>

<div class="statCard">

<div class="circle">

<span id="waterValue">

0/3

</span>

</div>

<p>💧 Su</p>

</div>

<div class="statCard">

<div class="circle">

<span id="carbValue">

0/220

</span>

</div>

<p>🍞 Karbonhidrat</p>

</div>

</section>

<section class="card">

<h2>📋 Bugünün Özeti</h2>

<div class="mealGrid">

<div>

🍳

<p id="breakfastCount">

0

</p>

</div>

<div>

🍲

<p id="lunchCount">

0

</p>

</div>

<div>

🍽️

<p id="dinnerCount">

0

</p>

</div>

<div>

☕

<p id="snackCount">

0

</p>

</div>

</div>

<button id="addWater">

💧 +250 ml Su

</button>

<button id="finishDay">

📅 Günü Bitir

</button>

</section>

</section>

<!-- BESİNLER -->

<section id="foodPage"
class="page"
style="display:none;">

<section class="card">

<h2>🍽️ Besinler</h2>

<input
id="foodSearch"
placeholder="Besin ara...">

<div id="foodResults">

</div>

<select id="mealType">

<option value="breakfast">

🍳 Kahvaltı

</option>

<option value="lunch">

🍲 Öğle

</option>

<option value="dinner">

🍽️ Akşam

</option>

<option value="snack">

☕ Ara Öğün

</option>

</select>

<input
id="foodAmount"
type="number"
value="100">

<button id="calculateFood">

🧮 Hesapla

</button>

<div id="foodInfo">

Bir besin seç.

</div>

<button id="addFood">

➕ Günlüğe Ekle

</button>

</section>

<section class="card">

<h2>❤️ Favoriler</h2>

<div id="favorites">

Henüz favori yok.

</div>

</section>

</section>

<!-- SPOR -->

<section id="sportPage"
class="page"
style="display:none;">

<section class="card">

<h2>💪 Antreman</h2>

<label>

Dakika:

<span id="durationText">

45

</span>

</label>

<input
id="duration"
type="range"
min="5"
max="180"
value="45">

<label>

Hız:

<span id="speedText">

5

</span>

km/sa

</label>

<input
id="speed"
type="range"
min="3"
max="10"
value="5">

<label>

Eğim:

<span id="inclineText">

5

</span>

%

</label>

<input
id="incline"
type="range"
min="0"
max="15"
value="5">

<div id="exerciseCalories">

0 kcal

</div>

</section>

</section>

<!-- GEÇMİŞ -->

<section id="historyPage"
class="page"
style="display:none;">

<section class="card">

<h2>📈 Geçmiş</h2>

<div id="history">

Henüz kayıt yok.

</div>

</section>

</section>

<!-- PROFİL -->

<section id="profilePage"
class="page"
style="display:none;">

<section class="card">

<h2>⚖️ Profil</h2>

<input
id="weight"
type="number"
placeholder="Kilo">

<input
id="height"
type="number"
placeholder="Boy">

<input
id="age"
type="number"
placeholder="Yaş">

<button id="calculateTargets">

Hedefleri Hesapla

</button>

</section>

</section>

<!-- ALT MENÜ -->

<nav class="bottomNav">

<button onclick="showPage('homePage')">

🏠

<br>

Ana Sayfa

</button>

<button onclick="showPage('foodPage')">

🍽️

<br>

Besinler

</button>

<button onclick="showPage('sportPage')">

💪

<br>

Spor

</button>

<button onclick="showPage('historyPage')">

📈

<br>

Geçmiş

</button>

<button onclick="showPage('profilePage')">

👤

<br>

Profil

</button>

</nav>

</div>

<script src="foods.js"></script>

<script src="app.js"></script>

</body>

</html>
