<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VK Kalori v2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;max-width:430px;margin:auto;background:#f3f4f6;padding-bottom:80px}
.header{background:#d71920;color:#fff;padding:18px;text-align:center}.card{background:#fff;margin:14px;padding:18px;border-radius:18px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.meal{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}
button,input,select{padding:12px;border-radius:10px;border:1px solid #ddd;width:100%;margin-top:8px}
button{background:#d71920;color:#fff;border:none}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5)}
#box{background:#fff;width:90%;max-width:340px;margin:100px auto;padding:20px;border-radius:16px}
.item{padding:6px 0;border-bottom:1px solid #eee}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
</style></head><body>
<div class="header"><h1>VK KALORİ</h1></div>
<div class="card"><div class="summary">
<div><b id=kal>0</b><br>kcal</div><div><b id=pro>0</b><br>P</div><div><b id=car>0</b><br>K</div><div><b id=fat>0</b><br>Y</div>
</div></div>

<div class="card"><h2>Öğünler</h2>
<div class=meal><span>🍳 Kahvaltı</span><button onclick="openM('breakfast')">+</button></div><div id=breakfast></div>
<div class=meal><span>☀️ Öğle</span><button onclick="openM('lunch')">+</button></div><div id=lunch></div>
<div class=meal><span>🌙 Akşam</span><button onclick="openM('dinner')">+</button></div><div id=dinner></div>
<div class=meal><span>🍎 Ara Öğün</span><button onclick="openM('snack')">+</button></div><div id=snack></div>
</div>

<div id=modal><div id=box>
<h3>Besin Ekle</h3>
<select id=food>
<option value="165,31,0,4">Tavuk göğsü</option>
<option value="130,3,28,0">Pirinç pilavı</option>
<option value="155,13,1,11">Yumurta</option>
<option value="61,3.5,4.7,3.3">Yoğurt</option>
<option value="164,9,27,2.5">Nohut</option>
<option value="120,24,3,2">Protein tozu</option>
</select>
<input id=gram type=number placeholder="Gram">
<button onclick=add()>Ekle</button>
<button onclick=closeM()>Kapat</button>
</div></div>

<script>
let meal='',tc=0,tp=0,tcar=0,tf=0;
function openM(m){meal=m;modal.style.display='block'}
function closeM(){modal.style.display='none'}
function add(){
let g=parseFloat(gram.value);if(!g)return;
let s=food.value.split(','),n=food.options[food.selectedIndex].text;
let c=s[0]*g/100,p=s[1]*g/100,ca=s[2]*g/100,f=s[3]*g/100;
tc+=+c;tp+=+p;tcar+=+ca;tf+=+f;
document.getElementById(meal).innerHTML+=`<div class=item>${n} - ${g} g - ${Math.round(c)} kcal</div>`;
kal.innerText=Math.round(tc);pro.innerText=Math.round(tp);car.innerText=Math.round(tcar);fat.innerText=Math.round(tf);
closeM();
}
</script></body></html>
