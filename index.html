<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VK Kalori</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#f3f3f3;
font-family:Arial,sans-serif;
color:#111
}
header{
background:#d71920;
padding:15px;
position:sticky;
top:0;
z-index:10;
border-radius:0 0 20px 20px
}
.logo{
font-size:34px;
font-weight:900
}
nav{
display:flex;
gap:6px;
overflow-x:auto;
margin-top:10px
}
nav button{
border:0;
background:white;
padding:9px 12px;
border-radius:10px;
font-weight:bold;
white-space:nowrap
}
main{
max-width:800px;
margin:auto;
padding:12px
}
.card{
background:white;
padding:16px;
border-radius:18px;
margin-bottom:12px;
box-shadow:0 2px 10px #0001
}
.hero{
background:#111;
color:white
}
.big{
font-size:38px;
font-weight:900
}
.muted{
color:#777
}
.hero .muted{
color:#aaa
}
.bar{
height:10px;
background:#444;
border-radius:20px;
overflow:hidden;
margin:8px 0
}
.fill{
height:100%;
background:#d71920;
width:0
}
.mode{
display:flex;
gap:8px;
margin-top:12px
}
.mode button{
flex:1;
padding:12px;
border:2px solid #ddd;
border-radius:12px;
font-weight:bold
}
.mode .on{
background:#d71920;
border-color:#d71920;
color:white
}
.macro{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
margin-top:12px
}
.macro div{
background:#eee;
color:#111;
padding:10px;
text-align:center;
border-radius:10px
}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}
.quick{
border:0;
background:white;
padding:14px;
border-radius:14px;
font-weight:bold
}
.btn{
border:0;
padding:11px 15px;
border-radius:10px;
background:#111;
color:white;
font-weight:bold
}
.red{
background:#d71920
}
.gray{
background:#eee;
color:#111
}
.danger{
background:#ffe0e0;
color:#a00
}
.actions{
display:flex;
gap:7px;
flex-wrap:wrap
}
.row{
display:grid;
grid-template-columns:85px 1fr 70px 38px;
gap:5px;
margin:7px 0
}
input,select{
width:100%;
padding:10px;
border:1px solid #ddd;
border-radius:9px;
background:white
}
.recipe,.exercise{
border:1px solid #eee;
padding:12px;
border-radius:14px;
margin:8px 0
}
.exercise{
display:flex;
gap:12px;
align-items:center
}
.pic{
width:55px;
height:50px;
background:#eee;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
font-size:24px
}
.tag{
background:#eee;
padding:4px 7px;
border-radius:7px;
font-size:11px
}
.hidden{
display:none
}
.done{
opacity:.45
}
</style>
</head>

<body>

<header>
<div class="logo">VK</div>
<div>Kalori • Beslenme • Fit Yaşam</div>

<nav>
<button onclick="showPage('home')">Ana Sayfa</button>
<button onclick="showPage('food')">Beslenme</button>
<button onclick="showPage('workout')">Antrenman</button>
<button onclick="showPage('recipes')">Fit Tarifler</button>
<button onclick="showPage('history')">Geçmiş</button>
</nav>
</header>

<main>

<!-- ANA SAYFA -->

<section id="home">

<div class="grid">

<button class="quick" onclick="showPage('food');addRow()">
🍽️ Yemek Ekle
</button>

<button class="quick" onclick="showPage('recipes')">
🥗 Fit Tarifler
</button>

<button class="quick" onclick="showPage('workout')">
🏋️ Antrenman
</button>

<button class="quick" onclick="finishDay()">
🏁 Günü Bitir
</button>

</div>


<div class="card hero">

<div class="muted">
BUGÜNÜN KALORİ HEDEFİ
</div>

<div>
<span class="big" id="total">0</span>
/
<span id="target">2100</span>
 kcal
</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>


<div class="mode">

<button id="restBtn" onclick="setSport(false)">
🛋️ Dinlenme Günü
</button>

<button id="sportBtn" onclick="setSport(true)">
🏋️ Spor Günü
</button>

</div>


<div class="macro">

<div>
Protein<br>
<b id="protein">0</b> g
</div>

<div>
Karbonhidrat<br>
<b id="carb">0</b> g
</div>

<div>
Yağ<br>
<b id="fat">0</b> g
</div>

</div>

</div>


<div class="card">

<b>Bugünkü durum</b>

<p id="status" class="muted">
Bugün henüz kayıt yok.
</p>

<button class="btn gray" onclick="resetToday()">
Bugünü Sıfırla
</button>

</div>

</section>


<!-- BESLENME -->

<section id="food" class="hidden">

<div class="card">

<h2>🍽️ Beslenme</h2>

<p class="muted">
Yediğin her şeyi öğün ve miktarıyla ekleyebilirsin.
</p>

<div id="mealRows"></div>

<div class="actions">

<button class="btn gray" onclick="addRow()">
＋ Satır Ekle
</button>

<button class="btn red" onclick="calculateMeals()">
Hesapla
</button>

<button class="btn" onclick="saveMeals()">
Kaydet
</button>

</div>

<div id="calculation"></div>

</div>

</section>


<!-- ANTRENMAN -->

<section id="workout" class="hidden">

<div class="card">

<h2>🏋️ Antrenman</h2>

<p id="workoutInfo" class="muted"></p>

<div id="exerciseList"></div>

<button
class="btn red"
onclick="completeWorkout()">
Antrenmanı Bitir → Sonraki
</button>

</div>

</section>


<!-- TARİFLER -->

<section id="recipes" class="hidden">

<div class="card">

<h2>🥗 Fit Tarifler</h2>

<input
id="recipeSearch"
placeholder="Brownie, tavuk, cheesecake..."
oninput="renderRecipes()"
>

<div id="recipeList"></div>

</div>

</section>


<!-- GEÇMİŞ -->

<section id="history" class="hidden">

<div class="card">

<h2>📅 Geçmiş</h2>

<div id="historyList"></div>

</div>

</section>

</main>


<script>

const recipes=[

["Et Şiş","Akşam",400,42,9,23],

];


/* =========================
   ANTRENMAN
========================= */

const exercises=[

["Squat","3 set × 12-15 tekrar"],

["Leg Press","3 set × 12-15 tekrar"],

["Leg Curl","3 set × 12-15 tekrar"],

["Leg Extension","3 set × 12-15 tekrar"],

["Calf Raise","3 set × 15 tekrar"],

["Koşu Bandı","20-30 dakika"]

];


/* =========================
   DURUM
========================= */

let data=JSON.parse(
localStorage.getItem("VK_DATA") ||
'{"meals":[],"sport":false,"workout":1,"done":[],"history":[]}'
);


function save(){

localStorage.setItem(
"VK_DATA",
JSON.stringify(data)
);

}


/* =========================
   SAYFA DEĞİŞTİR
========================= */

function showPage(id){

document
.querySelectorAll("main section")
.forEach(x=>x.classList.add("hidden"));

document
.getElementById(id)
.classList.remove("hidden");

if(id==="food") renderRows();

if(id==="workout") renderWorkout();

if(id==="recipes") renderRecipes();

if(id==="history") renderHistory();

}


/* =========================
   SPOR GÜNÜ
========================= */

function setSport(value){

data.sport=value;

save();

update();

}


/* =========================
   SATIR EKLE
========================= */

function addRow(
meal="Kahvaltı",
name="",
qty=""
){

const row=
document.createElement("div");

row.className="row";

row.innerHTML=`

<select>

<option ${meal==="Kahvaltı"?"selected":""}>
Kahvaltı
</option>

<option ${meal==="Ara Öğün"?"selected":""}>
Ara Öğün
</option>

<option ${meal==="Öğle"?"selected":""}>
Öğle
</option>

<option ${meal==="İkindi"?"selected":""}>
İkindi
</option>

<option ${meal==="Akşam"?"selected":""}>
Akşam
</option>

<option ${meal==="Gece"?"selected":""}>
Gece
</option>

</select>

<input
class="foodName"
placeholder="Yemek / ürün"
value="${name}"
>

<input
class="foodQty"
type="number"
step="0.1"
placeholder="gram"
value="${qty}"
>

<button
class="btn danger"
onclick="this.parentElement.remove()"
>
×
</button>

`;

document
.getElementById("mealRows")
.appendChild(row);

}


/* =========================
   SATIRLARI GÖSTER
========================= */

function renderRows(){

const box=
document.getElementById("mealRows");

box.innerHTML="";

if(data.meals.length===0){

addRow();

}else{

data.meals.forEach(x=>
addRow(
x.meal,
x.name,
x.qty
));

}

}


/* =========================
   YEMEK BUL
========================= */

function findFood(name){

name=name
.toLowerCase()
.trim();

const exact=
foods[name];

if(exact)
return name;

return Object.keys(foods)
.find(key=>
name.includes(key) ||
key.includes(name)
);

}


/* =========================
   HESAPLA
========================= */

function readMeals(){

return [

...document
.querySelectorAll(".row")

]

.map(row=>{

const meal=
row.querySelector("select").value;

const name=
row.querySelector(".foodName")
.value
.trim();

const qty=
Number(
row.querySelector(".foodQty")
.value
) || 0;

const key=
findFood(name);

const food=
key ? foods[key] : null;

let factor=0;

if(food){

if(
food[4]==="adet" ||
food[4]==="bar"
){

factor=qty;

}else{

factor=qty/100;

}

}

return{

meal,

name,

qty,

kcal:
food
? food[0]*factor
: 0,

protein:
food
? food[1]*factor
: 0,

carb:
food
? food[2]*factor
: 0,

fat:
food
? food[3]*factor
: 0,

unknown:
!food

};

})

.filter(x=>x.name);

}


function sumMeals(meals){

return meals.reduce(

(total,item)=>({

kcal:
total.kcal+item.kcal,

protein:
total.protein+item.protein,

carb:
total.carb+item.carb,

fat:
total.fat+item.fat

}),

{
kcal:0,
protein:0,
carb:0,
fat:0
}

);

}


function calculateMeals(){

const meals=
readMeals();

const total=
sumMeals(meals);

const unknown=
meals.filter(x=>x.unknown);

document.getElementById(
"calculation"
).innerHTML=`

<div class="card">

<h3>
${total.kcal.toFixed(0)} kcal
</h3>

<b>
Protein:
${total.protein.toFixed(1)} g
</b>

<br>

Karbonhidrat:
${total.carb.toFixed(1)} g

<br>

Yağ:
${total.fat.toFixed(1)} g

${unknown.length?

`

<hr>

<p style="color:#b00000">

⚠️ Veri tabanında bulunamayan:

<b>
${unknown
.map(x=>x.name)
.join(", ")}
</b>

<br><br>

Bu ürünün etiketindeki
100 g / porsiyon kalori ve protein
değerini girersen daha doğru
hesaplayabiliriz.

</p>

`

:""}

</div>

`;

}


/* =========================
   KAYDET
========================= */

function saveMeals(){

data.meals=
readMeals();

save();

calculateMeals();

update();

alert("Beslenme kaydedildi.");

}


/* =========================
   ANA EKRAN
========================= */

function update(){

const total=
sumMeals(data.meals);

const target=
data.sport
?2300
:2100;

document.getElementById(
"total"
).textContent=
Math.round(total.kcal);

document.getElementById(
"target"
).textContent=
target;

document.getElementById(
"protein"
).textContent=
total.protein.toFixed(0);

document.getElementById(
"carb"
).textContent=
total.carb.toFixed(0);

document.getElementById(
"fat"
).textContent=
total.fat.toFixed(0);

document.getElementById(
"fill"
).style.width=
Math.min(
100,
total.kcal/target*100
)+"%";


document.getElementById(
"sportBtn"
).classList.toggle(
"on",
data.sport
);

document.getElementById(
"restBtn"
).classList.toggle(
"on",
!data.sport
);


document.getElementById(
"status"
).textContent=

total.kcal>0

?

`${Math.round(total.kcal)} kcal • ${total.protein.toFixed(0)} g protein kaydedildi.`

:

"Bugün henüz kayıt yok.";

}


/* =========================
   GÜNÜ BİTİR
========================= */

function finishDay(){

const total=
sumMeals(data.meals);

data.history.unshift({

date:
new Date()
.toLocaleDateString("tr-TR"),

kcal:
Math.round(total.kcal),

protein:
Math.round(total.protein),

sport:
data.sport

});


/*
YENİ GÜN
*/

data.meals=[];

data.sport=false;

save();

renderRows();

update();

alert(
"Bugün tamamlandı.\n\n"+
"Toplam: "+
Math.round(total.kcal)+
" kcal\n"+
"Protein: "+
Math.round(total.protein)+
" g\n\n"+
"Yeni gün sıfırdan başladı."
);

}


/* =========================
   BUGÜNÜ SIFIRLA
========================= */

function resetToday(){

if(
confirm(
"Bugünkü tüm yemek kayıtları silinsin mi?"
)
){

data.meals=[];

data.sport=false;

save();

renderRows();

update();

}

}


/* =========================
   ANTRENMAN
========================= */

function renderWorkout(){

document.getElementById(
"workoutInfo"
).textContent=
`Program ${data.workout}/3`;

document.getElementById(
"exerciseList"
).innerHTML=

exercises.map(
(x,i)=>`

<div
class="exercise ${
data.done.includes(i)
?"done":""
}"
onclick="toggleExercise(${i})"
>

<div class="pic">
🏋️
</div>

<div>

<b>
${i+1}. ${x[0]}
</b>

<br>

<span class="muted">
${x[1]}
</span>

</div>

</div>

`
).join("");

}


function toggleExercise(i){

if(
data.done.includes(i)
){

data.done=
data.done.filter(
x=>x!==i
);

}else{

data.done.push(i);

}

save();

renderWorkout();

}


function completeWorkout(){

data.workout=
data.workout>=3
?1
:data.workout+1;

data.done=[];

data.sport=true;

save();

renderWorkout();

update();

alert(
"Antrenman tamamlandı!\n\n"+
"Sonraki antrenmana geçildi."
);

}


/* =========================
   TARİFLER
========================= */

function renderRecipes(){

const search=
(
document.getElementById(
"recipeSearch"
)?.value || ""
)
.toLowerCase();

document.getElementById(
"recipeList"
).innerHTML=

recipes
.filter(x=>
x.join(" ")
.toLowerCase()
.includes(search)
)
.map(
(x,i)=>`

<div class="recipe">

<span class="tag">
${x[1]}
</span>

<h3>
${x[0]}
</h3>

<div class="macro">

<div>
<b>${x[2]}</b><br>
kcal
</div>

<div>
<b>${x[3]} g</b><br>
protein
</div>

<div>
<b>${x[4]} g</b><br>
KH
</div>

</div>

<br>

<button
class="btn gray"
onclick="recipeInfo(${i})"
>
📖 Açıklama / Porsiyon
</button>

</div>

`
)
.join("");

}


function recipeInfo(i){

const recipe=
recipes[i];

const portion=
Number(
prompt(
"Kaç porsiyon?",
"1"
)
) || 1;

alert(

recipe[0]+
"\n\n"+

portion+
" porsiyon\n\n"+

Math.round(
recipe[2]*portion
)+
" kcal\n"+

Math.round(
recipe[3]*portion
)+
" g protein\n"+

Math.round(
recipe[4]*portion
)+
" g karbonhidrat\n"+

Math.round(
recipe[5]*portion
)+
" g yağ\n\n"+

"Not: Akşam yenmesi tek başına zararlı değildir. Günlük toplam kalori ve porsiyon önemlidir."

);

}


/* =========================
   GEÇMİŞ

function renderHistory(){
