<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>VK Yaşam Koçu</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container">

<header>

<div>

<h1>VK Yaşam Koçu</h1>

<p id="todayDate"></p>

</div>

<button id="profileButton">

⚙️

</button>

</header>

<section class="dashboard">

<div class="goal-card">

<div class="goal-circle">

<span id="calorieText">

0 / 2200

</span>

</div>

<p>🔥 Kalori</p>

</div>

<div class="goal-card">

<div class="goal-circle">

<span id="proteinText">

0 / 165

</span>

</div>

<p>🥩 Protein</p>

</div>

<div class="goal-card">

<div class="goal-circle">

<span id="waterText">

0 / 3

</span>

</div>

<p>💧 Su</p>

</div>

<div class="goal-card">

<div class="goal-circle">

<span id="carbText">

0 / 220

</span>

</div>

<p>🍞 Karbonhidrat</p>

</div>

</section>

<section class="day-mode">

<button id="sportMode"
class="active">

🏋️ Spor Günü

</button>

<button id="normalMode">

🌙 Normal Gün

</button>

</section>

<section class="card">

<h2>📋 Bugünün Özeti</h2>

<ul>

<li>🍳 Kahvaltı:
<span id="breakfastCount">

0

</span>

</li>

<li>🍲 Öğle:
<span id="lunchCount">

0

</span>

</li>

<li>🍽️ Akşam:
<span id="dinnerCount">

0

</span>

</li>

<li>☕ Ara Öğün:
<span id="snackCount">

0

</span>

</li>

</ul>

<button id="addWater">

💧 +250 ml Su

</button>

<button id="finishDay">

📅 Günü Bitir

</button>

</section>

<section class="card">

<h2>🍽️ Besinler</h2>

<input
id="foodSearch"
type="text"
placeholder="Peynir, tavuk, zeytin, protein tozu...">

<div id="foodResults">

</div>

<select id="foodUnit">

<option>Gram</option>

<option>Adet</option>

<option>Porsiyon</option>

<option>ml</option>

<option>Ölçek</option>

</select>

<input
id="foodAmount"
type="number"
value="100">

<button id="calculateFood">

🧮 Hesapla

</button>

<div id="foodCalculation">

Besin seçiniz.

</div>

<button id="addFood">

➕ Günlüğe Ekle

</button>

</section>

<section class="card">

<h2>🚶 Spor</h2>

<label>

Süre

</label>

<input
id="duration"
type="range"
min="5"
max="180"
value="45">

<label>

Hız

</label>

<input
id="speed"
type="range"
min="3"
max="10"
value="5">

<label>

Eğim

</label>

<input
id="incline"
type="range"
min="0"
max="15"
value="5">

<div id="sportCalories">

0 kcal

</div>

</section>

<section class="card">

<h2>📈 Geçmiş</h2>

<div id="history">

Henüz kayıt yok.

</div>

</section>

<nav>

<button>

🏠

</button>

<button>

🍽️

</button>

<button>

💪

</button>

<button>

📈

</button>

</nav>

<script src="foods.js"></script>

<script src="app.js"></script>

</body>

</html>
