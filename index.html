<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VK Kalori</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
padding:15px;
font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;
background:#f3f4f6;
color:#111;
max-width:430px;
margin:auto;
}

.header{
background:#d71920;
color:#fff;
padding:20px;
border-radius:25px;
margin-bottom:15px;
}

.logo{
font-size:40px;
font-weight:900;
}

.card{
background:#fff;
padding:18px;
border-radius:20px;
margin-bottom:15px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.big{
font-size:48px;
font-weight:900;
}

.bar{
height:12px;
background:#eee;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.fill{
height:100%;
background:#d71920;
width:0%;
}

.row{
display:grid;
grid-template-columns:1fr 85px 95px 40px;
gap:5px;
margin-bottom:8px;
}

input,select{
padding:12px;
border:1px solid #ddd;
border-radius:12px;
width:100%;
}

button{
border:0;
padding:14px;
border-radius:14px;
font-weight:700;
}

.btn{
background:#111;
color:#fff;
width:100%;
margin-top:8px;
}

.red{
background:#d71920;
}

.gray{
background:#eee;
color:#111;
}

.list{
font-size:14px;
line-height:1.8;
}

.small{
font-size:13px;
color:#777;
}
</style>
</head>

<body>

<div class="header">

<div class="logo">VK</div>

<div>Kalori ve Protein Takibi</div>

</div>

<div class="card">

<div>Günlük Hedef</div>

<div>
<span class="big" id="total">0</span>
/
<span id="target">2100</span> kcal
</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<br>

Protein:
<b id="protein">0</b> g

</div>

<div class="card">

<h3>🍽️ Yemek Ekle</h3>

<div id="rows"></div>

<button class="btn gray" onclick="addRow()">
+ Yemek Ekle
</button>

<button class="btn red" onclick="saveMeals()">
Kaydet
</button>

</div>

<div class="card">

<h3>🔥 Spor Kalorisi</h3>

<input
id="exercise"
type="number"
placeholder="Yakılan kalori"
>

<button class="btn" onclick="addExercise()">
Kalori Düş
</button>

</div>

<div class="card">

<h3>📋 Bugünkü Yemekler</h3>

<div class="list" id="summary">
Henüz kayıt yok.
</div>

</div>

<script>

const foods={

"yumurta":[78,6.3,"adet"],

"tavuk":[165,31,"100g"],

"tavuk göğsü":[165,31,"100g"],

"pirinç pilavı":[130,2.7,"100g"],

"bulgur":[120,3.1,"100g"],

"kuru fasulye":[127,8.7,"100g"],

"nohut":[164,8.9,"100g"],

"yoğurt":[61,3.5,"100g"],

"muz":[89,1.1,"100g"],

"elma":[52,.3,"100g"],

"yulaf":[389,16.9,"100g"],

"whey protein":[100,20,"25g"],

"protein tozu":[100,20,"25g"],

"ekmek":[265,9,"100g"],

"süt":[61,3.2,"100ml"],

"köfte":[250,20,"100g"],

"pizza":[266,11,"100g"],

"protein bar":[200,20,"adet"]

};

let data=JSON.parse(
localStorage.getItem("vk")||
'{"meals":[],"exercise":0}'
);

function addRow(name="",qty="",unit="g"){

const div=document.createElement("div");

div.className="row";

div.innerHTML=`

<input class="name"
placeholder="Yemek"
value="${name}">

<input class="qty"
type="number"
value="${qty}"
placeholder="Miktar">

<select class="unit">

<option ${unit=="g"?"selected":""}>g</option>

<option ${unit=="adet"?"selected":""}>adet</option>

<option ${unit=="porsiyon"?"selected":""}>porsiyon</option>

<option ${unit=="ml"?"selected":""}>ml</option>

</select>

<button onclick="this.parentElement.remove()">
❌
</button>

`;

rows.appendChild(div);

}

function findFood(name){

name=name.toLowerCase();

return Object.keys(foods)
.find(x=>name.includes(x));

}

function saveMeals(){

const meals=[

...document.querySelectorAll(".row")

]

.map(r=>({

name:r.querySelector(".name").value,

qty:Number(
r.querySelector(".qty").value
),

unit:r.querySelector(".unit").value

}))

.filter(x=>x.name);

data.meals=meals;

localStorage.setItem(
"vk",
JSON.stringify(data)
);

update();

}

function addExercise(){

const kcal=
Number(
document.getElementById("exercise")
.value
);

data.exercise+=kcal;

localStorage.setItem(
"vk",
JSON.stringify(data)
);

update();

}

function update(){

let kcal=0;

let protein=0;

let html="";

data.meals.forEach(m=>{

const key=findFood(m.name);

if(!key)return;

const food=foods[key];

let factor=1;

if(food[2]=="adet"){

factor=m.qty;

}else if(food[2]=="25g"){

factor=m.qty/25;

}else{

factor=m.qty/100;

}

kcal+=food[0]*factor;

protein+=food[1]*factor;

html+=
"• "+
m.name+
" ("+
m.qty+
" "+
m.unit+
")<br>";

});

kcal-=data.exercise;

if(kcal<0)kcal=0;

document.getElementById(
"total"
).innerText=Math.round(kcal);

document.getElementById(
"protein"
).innerText=Math.round(protein);

document.getElementById(
"fill"
).style.width=
Math.min(
100,
kcal/2100*100
)+"%";

document.getElementById(
"summary"
).innerHTML=
html||"Henüz kayıt yok.";

}

if(data.meals.length){

data.meals.forEach(
m=>addRow(
m.name,
m.qty,
m.unit
)
);

}else{

addRow();

}

update();

</script>

</body>
</html>
