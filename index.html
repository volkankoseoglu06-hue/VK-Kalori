<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VK Kalori</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#efefef;
}

.header{
background:#c62828;
padding:28px;
color:white;
border-bottom-left-radius:30px;
border-bottom-right-radius:30px;
}

.logo{
font-size:58px;
font-weight:bold;
}

.menu{
display:flex;
gap:8px;
overflow:auto;
margin-top:15px;
}

.menu button{
border:none;
padding:10px 14px;
border-radius:14px;
background:white;
font-weight:bold;
}

.page{
display:none;
padding:16px;
}

.page.active{
display:block;
}

.card{
background:white;
padding:18px;
border-radius:20px;
margin-bottom:14px;
}

.summary{
background:#111;
color:white;
padding:14px;
border-radius:14px;
margin-bottom:10px;
}

input,select{
width:100%;
box-sizing:border-box;
padding:12px;
margin-top:8px;
border:1px solid #ccc;
border-radius:12px;
}

.action{
width:100%;
border:none;
padding:12px;
margin-top:10px;
border-radius:12px;
background:#c62828;
color:white;
font-weight:bold;
}

.foodItem{
padding:10px;
background:#fafafa;
border-radius:12px;
margin-top:6px;
}

.deleteBtn{
float:right;
border:none;
border-radius:8px;
padding:4px 8px;
}

.suggest{
width:100%;
border:none;
padding:10px;
margin-top:5px;
border-radius:10px;
}
</style>
</head>

<body>

<div class="header">

<div class="logo">VK</div>

<div>Kalori • Beslenme • Takip</div>

<div class="menu">

<button onclick="openPage('home')">🏠</button>

<button onclick="openPage('food')">🍽️</button>

<button onclick="openPage('history')">📅</button>

<button onclick="openPage('profile')">👤</button>

</div>

</div>

<div id="home" class="page active">

<div class="summary">
🔥 <span id="calorieTotal">0</span> /
<span id="goalText">1900</span> kcal
</div>

<div class="summary">
🥩 Protein: <span id="proteinTotal">0</span> g
</div>

<div class="summary">
🥑 Yağ: <span id="fatTotal">0</span> g
</div>

<div class="summary">
🍞 Karbonhidrat: <span id="carbTotal">0</span> g
</div>

<div class="card">

<h3>Bugünkü Öğünler</h3>

<div id="todayMeals"></div>

</div>

</div>

<div id="food" class="page">

<div class="card">

<select id="mealType">

<option>Kahvaltı</option>

<option>Öğle</option>

<option>Akşam</option>

<option>Ara Öğün</option>

</select>

<input
id="search"
placeholder="Peynir, tavuk, protein tozu..."
onkeyup="findFood()">

<div id="suggestions"></div>

</div>

</div>

<div id="history" class="page">

<div class="card">

<h3>Geçmiş</h3>

<p>Bugünkü kayıtlar saklanır.</p>

<div id="historyArea"></div>

</div>

</div>

<div id="profile" class="page">

<div class="card">

<input
id="goalInput"
type="number"
placeholder="Günlük kalori hedefi">

<button
class="action"
onclick="saveGoal()">

Kaydet

</button>

</div>

</div>

<script>

const foods=[

{name:"yumurta",k:78,p:6.5,f:5,c:0.6},
{name:"beyaz peynir",k:330,p:24,f:26,c:2},
{name:"kaşar peyniri",k:404,p:25,f:33,c:1},
{name:"lor peyniri",k:98,p:18,f:4,c:3},
{name:"yoğurt",k:61,p:3.5,f:3,c:5},
{name:"ayran",k:35,p:2,f:1,c:3},
{name:"süt",k:61,p:3.3,f:3,c:5},
{name:"tavuk",k:165,p:31,f:4,c:0},
{name:"ton balığı",k:132,p:29,f:1,c:0},
{name:"pilav",k:130,p:3,f:0.3,c:28},
{name:"makarna",k:157,p:6,f:1,c:31},
{name:"kuru fasulye",k:127,p:9,f:0.5,c:23},
{name:"nohut",k:164,p:9,f:2.6,c:27},
{name:"muz",k:89,p:1.1,f:0.3,c:23},
{name:"karpuz",k:30,p:0.6,f:0.2,c:8},
{name:"protein tozu",k:120,p:20,f:2,c:3},
{name:"whey",k:120,p:20,f:2,c:3},
{name:"protein bar",k:200,p:20,f:7,c:18},
{name:"fit browni",k:180,p:15,f:6,c:18}

];

let meals=JSON.parse(localStorage.getItem("vkMeals"))||[];

let goal=localStorage.getItem("vkGoal")||1900;

function openPage(id){

document.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

refresh();

}

function findFood(){

const text=document
.getElementById("search")
.value
.toLowerCase();

const result=foods.filter(
f=>f.name.includes(text)
);

let html="";

result.forEach((f,i)=>{

html+=
'<button class="suggest" onclick="addFood('+foods.indexOf(f)+')">'+f.name+'</button>';

});

document.getElementById(
"suggestions"
).innerHTML=html;

}

function addFood(index){

const food=foods[index];

const meal=document
.getElementById("mealType")
.value;

meals.push({

meal:meal,

name:food.name,

k:food.k,

p:food.p,

f:food.f,

c:food.c

});

localStorage.setItem(
"vkMeals",
JSON.stringify(meals)
);

refresh();

}

function deleteFood(i){

meals.splice(i,1);

localStorage.setItem(
"vkMeals",
JSON.stringify(meals)
);

refresh();

}

function saveGoal(){

goal=document
.getElementById("goalInput")
.value;

localStorage.setItem(
"vkGoal",
goal
);

refresh();

}

function refresh(){

let cal=0;
let protein=0;
let fat=0;
let carb=0;

let mealHTML="";

meals.forEach((m,i)=>{

cal+=m.k;
protein+=m.p;
fat+=m.f;
carb+=m.c;

mealHTML+=
'<div class="foodItem">'+
m.meal+
' - '+
m.name+
'<button class="deleteBtn" onclick="deleteFood('+i+')">❌</button></div>';

});

document.getElementById(
"todayMeals"
).innerHTML=mealHTML;

document.getElementById(
"historyArea"
).innerHTML=mealHTML;

document.getElementById(
"calorieTotal"
).innerText=Math.round(cal);

document.getElementById(
"proteinTotal"
).innerText=Math.round(protein);

document.getElementById(
"fatTotal"
).innerText=Math.round(fat);

document.getElementById(
"carbTotal"
).innerText=Math.round(carb);

document.getElementById(
"goalText"
).innerText=goal;

}

refresh();

</script>

</body>
</html>
