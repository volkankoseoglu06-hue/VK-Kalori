<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VK Kalori</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;
background:#f4f4f4;
color:#111;
}

.app{
max-width:430px;
margin:auto;
padding:16px;
}

.header{
background:linear-gradient(135deg,#111,#d71920);
color:#fff;
padding:24px;
border-radius:28px;
margin-bottom:16px;
}

.logo{
font-size:42px;
font-weight:900;
}

.subtitle{
opacity:.85;
margin-top:4px;
}

.card{
background:#fff;
border-radius:24px;
padding:18px;
margin-bottom:14px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.total{
font-size:48px;
font-weight:900;
}

.bar{
height:12px;
background:#ececec;
border-radius:20px;
overflow:hidden;
margin-top:12px;
}

.fill{
height:100%;
width:0;
background:#d71920;
}

.circles{
display:flex;
gap:10px;
justify-content:space-between;
margin-top:18px;
}

.circle{
width:95px;
height:95px;
background:#fafafa;
border-radius:50%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
font-size:12px;
font-weight:700;
}

.circle b{
font-size:24px;
}

.row{
display:grid;
grid-template-columns:1fr 80px 65px 42px;
gap:6px;
margin-bottom:8px;
}

input,select{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:14px;
font-size:15px;
}

button{
border:0;
border-radius:14px;
padding:14px;
font-weight:700;
font-size:15px;
}

.black{
background:#111;
color:#fff;
}

.red{
background:#d71920;
color:#fff;
}

.gray{
background:#ececec;
}

.delete{
background:#ffe5e5;
color:#d71920;
padding:0;
}

.food{
background:#f8f8f8;
padding:14px;
border-radius:16px;
margin-bottom:8px;
display:flex;
justify-content:space-between;
align-items:center;
}

.small{
font-size:13px;
color:#666;
}
</style>
</head>

<body>

<div class="app">

<div class="header">

<div class="logo">VK</div>

<div class="subtitle">
Kalori • Protein • Spor
</div>

<div style="margin-top:18px">
<div class="total">
<span id="kcal">0</span> kcal
</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>
</div>

<div class="circles">

<div class="circle">
<b id="protein">0</b>
Protein
</div>

<div class="circle">
<b id="sport">0</b>
Spor
</div>

<div class="circle">
<b>2100</b>
Hedef
</div>

</div>

</div>

<div class="card">

<h3>🍽️ Yemek Ekle</h3>

<div id="rows"></div>

<button class="gray" style="width:100%" onclick="addRow()">
+ Yemek Ekle
</button>

<button class="red" style="width:100%;margin-top:8px" onclick="saveMeals()">
Kaydet
</button>

</div>

<div class="card">

<h3>🔥 Spor</h3>

<input id="sportInput" type="number" placeholder="Yakılan kalori">

<button class="black" style="width:100%;margin-top:8px" onclick="addSport()">
Kalori Düş
</button>

</div>

<div class="card">

<h3>📋 Bugün</h3>

<div id="list">
Henüz kayıt yok.
</div>

<button class="gray" style="width:100%;margin-top:10px" onclick="resetAll()">
Temizle
</button>

</div>

</div>

<script>

const foods={

"yumurta":[78,6.3,"adet"],
"tavuk":[165,31,"100g"],
"tavuk göğsü":[165,31,"100g"],
"pilav":[130,2.7,"100g"],
"bulgur":[120,3.1,"100g"],
"kuru fasulye":[127,8.7,"100g"],
"nohut":[164,8.9,"100g"],
"yoğurt":[61,3.5,"100g"],
"muz":[89,1.1,"100g"],
"yulaf":[389,16.9,"100g"],
"ekmek":[265,9,"100g"],
"süt":[61,3.2,"100ml"],
"köfte":[250,20,"100g"],
"ton balığı":[116,26,"100g"],
"protein bar":[200,20,"adet"],
"protein tozu":[100,20,"25g"],
"whey protein":[100,20,"25g"]

};

let data=JSON.parse(
localStorage.getItem("vkkalori")||
'{"meals":[],"sport":0}'
);

function addRow(name="",qty="",unit="g"){

const div=document.createElement("div");

div.className="row";

div.innerHTML=`

<input class="foodName"
placeholder="Örn: tavuk"
value="${name}">

<input class="foodQty"
type="number"
value="${qty}"
placeholder="Miktar">

<select class="foodUnit">

<option ${unit=="g"?"selected":""}>g</option>
<option ${unit=="adet"?"selected":""}>adet</option>
<option ${unit=="ml"?"selected":""}>ml</option>

</select>

<button class="delete"
onclick="this.parentElement.remove()">

✕

</button>

`;

document.getElementById("rows").appendChild(div);

}

function findFood(name){

name=name.toLowerCase();

return Object.keys(foods)
.find(x=>name.includes(x));

}

function saveMeals(){

data.meals=[...document.querySelectorAll(".row")]

.map(r=>({

name:r.querySelector(".foodName").value,

qty:Number(
r.querySelector(".foodQty").value
)

}))

.filter(x=>x.name);

localStorage.setItem(
"vkkalori",
JSON.stringify(data)
);

update();

}

function addSport(){

data.sport+=Number(
document.getElementById("sportInput").value
)||0;

localStorage.setItem(
"vkkalori",
JSON.stringify(data)
);

update();

}

function resetAll(){

if(confirm("Tüm veriler silinsin mi?")){

localStorage.removeItem(
"vkkalori"
);

location.reload();

}

}

function update(){

let kcal=0;
let protein=0;
let html="";

data.meals.forEach(m=>{

const key=findFood(m.name);

if(!key)return;

const food=foods[key];

let factor=
food[2]=="adet"
?m.qty
:food[2]=="25g"
?m.qty/25
:m.qty/100;

let k=food[0]*factor;

kcal+=k;
protein+=food[1]*factor;

html+=`

<div class="food">

<div>

<b>${m.name}</b>

<div class="small">
${m.qty} • ${Math.round(k)} kcal
</div>

</div>

</div>

`;

});

kcal-=data.sport;

if(kcal<0)kcal=0;

document.getElementById("kcal").innerText=
Math.round(kcal);

document.getElementById("protein").innerText=
Math.round(protein);

document.getElementById("sport").innerText=
Math.round(data.sport);

document.getElementById("fill").style.width=
Math.min(100,kcal/2100*100)+"%";

document.getElementById("list").innerHTML=
html||"Henüz kayıt yok.";

}

if(data.meals.length){

data.meals.forEach(
x=>addRow(x.name,x.qty)
);

}else{

addRow();

}

update();

</script>

</body>
</html>
