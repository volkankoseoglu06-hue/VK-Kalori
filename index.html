<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>VK Kalori</title>

<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

VK KALORİ

</header>

<div class="container">

<div class="page active" id="home">

<div class="card">

<h2>🔥 Günlük Takip</h2>

<div class="stat">

<span>Kalori</span>

<span>
<b id="totalCalories">0</b>
/ 1900
</span>

</div>

<div class="stat">

<span>Protein</span>

<span>
<b id="totalProtein">0</b>
/ 150 g
</span>

</div>

<div class="stat">

<span>Karbonhidrat</span>

<span>
<b id="totalCarb">0</b>
/ 180 g
</span>

</div>

<div class="stat">

<span>Yağ</span>

<span>
<b id="totalFat">0</b>
/ 65 g
</span>

</div>

</div>

</div>

<div class="page" id="foods">

<div class="card">

<h2>🍽️ Besin Ara</h2>

<input
id="foodSearch"
placeholder="Tavuk, pilav, protein tozu..."
onkeyup="searchFoods()">

<div id="foodResults">

</div>

</div>

</div>

<div class="page" id="photo">

<div class="card">

<h2>📷 Fotoğraf Analizi</h2>

<div class="photo-box">

📷

<br><br>

<input type="file">

</div>

</div>

</div>

<div class="page" id="ai">

<div class="card">

<h2>🤖 VK AI</h2>

<input
id="aiQuestion"
placeholder="Sorunu yaz...">

<button
onclick="askAI()">

Sor

</button>

<div
class="ai-response"
id="aiAnswer">

Bugün sana nasıl yardımcı olabilirim?

</div>

</div>

</div>

</div>

<div class="bottom-nav">

<div
class="nav-item"
onclick="openPage('home')">

🏠

<br>

Ana

</div>

<div
class="nav-item"
onclick="openPage('foods')">

🍽️

<br>

Besin

</div>

<div
class="nav-item"
onclick="openPage('photo')">

📷

<br>

Analiz

</div>

<div
class="nav-item"
onclick="openPage('ai')">

🤖

<br>

AI

</div>

</div>

<script src="foods.js"></script>

<script src="app.js"></script>

<script src="ai.js"></script>

<script src="camera.js"></script>

</body>

</html>
