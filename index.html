<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>VK Yaşam Koçu</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

<header>

<div>

<h1>VK Yaşam Koçu</h1>

<p id="todayDate"></p>

</div>

<button id="profileButton">

⚙️

</button>

</header>

<main>

<section
class="page active"
id="homePage">

<div class="dashboard">

<div class="ring-card">

<div class="ring">

<span id="calorieText">

0 / 0

</span>

</div>

<p>🔥 Kalori</p>

</div>

<div class="ring-card">

<div class="ring">

<span id="proteinText">

0 / 0

</span>

</div>

<p>🥩 Protein</p>

</div>

<div class="ring-card">

<div class="ring">

<span id="waterText">

0 / 0

</span>

</div>

<p>💧 Su</p>

</div>

<div class="ring-card">

<div class="ring">

<span id="carbText">

0 / 0

</span>

</div>

<p>🍞 Karbonhidrat</p>

</div>

</div>

<div class="summary-card">

<h2>Bugünün Özeti</h2>

<ul id="todaySummary">

<li>Henüz kayıt yok.</li>

</ul>

</div>

<button
id="finishDayButton"
class="primary-button">

🔴 Günü Bitir

</button>

</section>

<section
class="page"
id="foodPage">

<div class="card">

<h2>🍽️ Besin Ekle</h2>

<input
id="foodSearch"
type="text"
placeholder="Besin ara...">

<div id="foodResults">

</div>

<label>

Birim

</label>

<select id="unitSelect">

<option>Gram</option>

<option>Adet</option>

<option>Porsiyon</option>

<option>ml</option>

<option>Ölçek</option>

</select>

<label>

Miktar

</label>

<input
id="amountInput"
type="number"
value="100">

<button
id="addFoodButton"
class="primary-button">

➕ Besin Ekle

</button>

</div>

</section>

<section
class="page"
id="sportPage">

<div class="card">

<h2>💪 Spor</h2>

<label>

Aktivite

</label>

<select id="sportType">

<option>Yürüyüş</option>

<option>Koşu</option>

<option>Bisiklet</option>

<option>Ağırlık</option>

</select>

<label>

Süre (dakika)

</label>

<input
id="durationInput"
type="range"
min="5"
max="180"
value="45">

<label>

Hız

</label>

<input
id="speedInput"
type="range"
min="1"
max="10"
value="5">

<label>

Eğim

</label>

<input
id="inclineInput"
type="range"
min="0"
max="15"
value="5">

<button
id="addSportButton"
class="primary-button">

🏃 Sporu Ekle

</button>

</div>

</section>

<section
class="page"
id="historyPage">

<div class="card">

<h2>📈 Geçmiş</h2>

<div id="historyList">

Henüz kayıt yok.

</div>

</div>

</section>

<section
class="page"
id="profilePage">

<div class="card">

<h2>⚙️ Profil</h2>

<input
id="ageInput"
type="number"
placeholder="Yaş">

<input
id="heightInput"
type="number"
placeholder="Boy (cm)">

<input
id="weightInput"
type="number"
placeholder="Kilo (kg)">

<input
id="targetWeightInput"
type="number"
placeholder="Hedef kilo">

<button
id="saveProfileButton"
class="primary-button">

💾 Kaydet

</button>

</div>

</section>

</main>

<nav class="bottom-nav">

<button
data-page="homePage">

🏠

<span>

Ana Sayfa

</span>

</button>

<button
data-page="foodPage">

🍽️

<span>

Yemekler

</span>

</button>

<button
data-page="sportPage">

💪

<span>

Spor

</span>

</button>

<button
data-page="historyPage">

📈

<span>

Geçmiş

</span>

</button>

</nav>

</div>

<script src="app.js">

</script>

</body>

</html>
