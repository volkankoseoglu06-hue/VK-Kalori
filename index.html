<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VK Kalori</title><style>*{box-sizing:border-box}body{font-family:Arial;background:#f2f4f7;max-width:430px;margin:auto;padding-bottom:80px}.h{background:#d71920;color:#fff;padding:15px} .card{background:#fff;margin:10px;padding:15px;border-radius:20px}.row{display:flex;gap:10px}.left{width:45%;text-align:center}.circle{width:150px;height:150px;border:10px solid #d71920;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:auto}.right{width:55%;display:grid;grid-template-columns:1fr 1fr;gap:8px}.m{background:#f7f7f7;padding:10px;border-radius:12px;text-align:center}button,input,select{width:100%;padding:10px;margin-top:8px}nav{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:auto;display:flex;justify-content:space-around;background:#000;color:#fff;padding:10px}</style></head><body><div class="h"><h2>VK KALORİ</h2></div><div class="card"><div class="row"><div class="left"><div class="circle"><div><h2 id=c>0</h2><small id=g>/1900</small></div></div><button onclick="goal=1900;updg()">Spor</button><button onclick="goal=1700;updg()">Normal</button></div><div class="right"><div class=m>P <div id=p>0</div></div><div class=m>K <div id=cr>0</div></div><div class=m>Y <div id=f>0</div></div><div class=m>SU<div>2.5</div></div></div></div></div><div class=card><h3>Besin Ekle</h3><select id=s><option value="165,31,0,4">Tavuk</option><option value="130,3,28,1">Pilav</option><option value="155,13,1,11">Yumurta</option><option value="61,3.5,4.7,3.3">Yoğurt</option><option value="120,24,3,2">Whey</option></select><input id=gr type=number placeholder="Gram"><button onclick="add()">Ekle</button><div id=log></div></div><nav><div>Ana</div><div>Besin</div><div>AI</div><div>Profil</div></nav><script>let goal=1900,t=[0,0,0,0];function updg(){g.innerText='/'+goal}function add(){let a=s.value.split(',').map(Number),grm=+gr.value||0;t[0]+=a[0]*grm/100;t[1]+=a[1]*grm/100;t[2]+=a[2]*grm/100;t[3]+=a[3]*grm/100;c.innerText=Math.round(t[0]);p.innerText=Math.round(t[1]);cr.innerText=Math.round(t[2]);f.innerText=Math.round(t[3]);log.innerHTML+='✓ '+s.options[s.selectedIndex].text+' '+grm+'g<br>'}</script></body></html>
